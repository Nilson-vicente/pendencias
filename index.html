<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pendências</title>
<style>
:root{
  --bar:#0f172a; --bar2:#1e293b; --bg:#f1f5f9; --sf:#ffffff; --tx:#0f172a; --t2:#475569; --t3:#94a3b8;
  --bd:#e2e8f0; --bd2:#cbd5e1; --ac:#2563eb; --ac-s:#eff6ff;
  --urg:#dc2626; --urg-s:#fef2f2; --nor:#2563eb; --bai:#94a3b8;
  --ok:#15803d; --ok-s:#f0fdf4; --warn:#b45309; --warn-s:#fffbeb; --vio:#7c3aed; --vio-s:#f5f3ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em}

/* ---------- barra superior ---------- */
.top{background:var(--bar);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px 0 16px}
.top-in.sub{padding-left:4px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:12px;font-weight:400;color:#94a3b8;margin-top:1px}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
.ib:active{background:var(--bar2)}
.tbtn{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.tbtn.gh{background:transparent;color:#cbd5e1}

/* ---------- conteúdo ---------- */
main{max-width:760px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
main.det{padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.kpi{border:0;background:transparent;padding:10px 4px 9px;text-align:center;border-right:1px solid var(--bd);position:relative}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi.on{background:var(--ac-s)}
.kpi.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac)}
.kpi.k-late b{color:var(--urg)}
.kpi.k-urg b{color:var(--urg)}

.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:0 10px;color:var(--t3)}
.search input{border:0;outline:0;flex:1;padding:9px 0;font:inherit;background:transparent;color:var(--tx);min-width:0}
.segm{display:flex;background:#e2e8f0;border-radius:8px;padding:2px}
.segm button{border:0;background:transparent;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--t2)}
.segm button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(15,23,42,.12)}

.lbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t2);margin:4px 4px 6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.lbar a{color:var(--ac);text-transform:none;letter-spacing:0;font-weight:600;text-decoration:none}

/* lista */
.list{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.grp{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.grp .n{background:#e2e8f0;border-radius:10px;padding:0 7px;font-size:11px}
.grp .sp{flex:1}
.grp.late{color:var(--urg)}
.grp button{border:0;background:transparent;color:var(--t2);padding:2px;display:flex}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 0;border-bottom:1px solid var(--bd);background:var(--sf);width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:#f8fafc}
.row .pr{width:4px;align-self:stretch;border-radius:0 3px 3px 0;background:var(--nor);flex:none}
.row.p-urgente .pr{background:var(--urg)}
.row.p-baixa .pr{background:var(--bai)}
.row .mid{flex:1;min-width:0}
.row .c1{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c2{color:var(--t2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .c3{display:flex;gap:6px;align-items:center;margin-top:4px;color:var(--t3);font-size:12px}
.row .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .dt{font-size:13px;font-weight:600;color:var(--t2);font-variant-numeric:tabular-nums}
.row .dt.late{color:var(--urg)} .row .dt.today{color:var(--ac)}
.row .chev{color:var(--t3)}
.row.done .c1,.row.done .c2{color:var(--t3)}

.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:#f1f5f9;color:var(--t2);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.s-aberta{background:var(--ac-s);color:var(--ac)}
.st.s-andamento{background:var(--vio-s);color:var(--vio)}
.st.s-aguardando_cliente,.st.s-aguardando_peca{background:var(--warn-s);color:var(--warn)}
.st.s-concluida{background:var(--ok-s);color:var(--ok)}
.pt{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em;text-transform:uppercase}
.pt.urgente{background:var(--urg-s);color:var(--urg)}
.pt.normal{background:var(--ac-s);color:var(--nor)}
.pt.baixa{background:#f1f5f9;color:var(--t2)}

.empty{text-align:center;color:var(--t2);padding:44px 20px;background:var(--sf);border:1px dashed var(--bd2);border-radius:10px}
.empty svg{width:36px;height:36px;color:var(--t3);margin-bottom:6px}
.note{display:flex;gap:10px;align-items:center;background:var(--warn-s);border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.note button{margin-left:auto;border:1px solid #fcd34d;background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:#92400e}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));height:52px;padding:0 18px 0 14px;border-radius:14px;background:var(--ac);color:#fff;border:0;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 16px rgba(37,99,235,.35);z-index:8}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:transparent;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--t3)}
.nav button.on{color:var(--ac)}

/* ---------- detalhe ---------- */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 14px 12px;border-bottom:1px solid var(--bd)}
.card-h .cli{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.card-h h2{margin:3px 0 8px;font-size:19px;line-height:1.3}
.card-h .chips{display:flex;gap:6px;flex-wrap:wrap}
.sec-t{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px 0}
.kv{display:grid;grid-template-columns:120px 1fr;font-size:14px}
.kv div{padding:9px 14px;border-bottom:1px solid var(--bd)}
.kv div:nth-child(odd){color:var(--t2);background:#f8fafc;border-right:1px solid var(--bd)}
.kv div:nth-last-child(-n+2){border-bottom:0}
.relato{padding:8px 14px 14px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.relato.vz{color:var(--t3);font-style:italic}
.tl{padding:6px 14px 6px}
.tl-i{display:flex;gap:10px;padding:8px 0;position:relative}
.tl-i::before{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--bd)}
.tl-i:last-child::before{display:none}
.tl-d{width:12px;height:12px;border-radius:50%;border:2px solid var(--ac);background:var(--sf);margin-top:4px;flex:none;z-index:1}
.tl-i.sys .tl-d{border-color:var(--t3)}
.tl-i.ok .tl-d{border-color:var(--ok);background:var(--ok)}
.tl-b{flex:1;min-width:0}
.tl-b small{color:var(--t3);font-size:12px;font-variant-numeric:tabular-nums}
.tl-b div{white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.tl-i.sys .tl-b div{color:var(--t2)}
.addnote{display:flex;gap:8px;padding:4px 14px 14px}
.addnote textarea{flex:1;min-height:42px;height:42px;resize:none;padding:10px;border:1px solid var(--bd2);border-radius:8px;font:inherit;font-size:14px}
.addnote button{border:0;background:var(--bar);color:#fff;border-radius:8px;padding:0 14px;font-weight:600;font-size:14px}

.abar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);z-index:9;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.abar-in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.btn{border:1px solid var(--bd2);background:var(--sf);color:var(--tx);border-radius:8px;padding:11px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dan{color:var(--urg);border-color:#fecaca;background:var(--urg-s)}
.btn.f1{flex:1}
.selbtn{position:relative;flex:1.2}
.selbtn select{position:absolute;inset:0;opacity:0;width:100%}

/* menu suspenso */
.menu{position:fixed;top:calc(52px + env(safe-area-inset-top));right:10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);z-index:30;min-width:190px;overflow:hidden}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;font-size:14px}
.menu button:active{background:#f1f5f9}
.menu button.dan{color:var(--urg)}
.scrim{position:fixed;inset:0;z-index:29}

/* ---------- formulário ---------- */
.fcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:4px 14px 14px;margin-bottom:12px}
.fcard h3{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:12px 0 5px}
label i{color:var(--urg);font-style:normal}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 11px;border:1px solid var(--bd2);border-radius:8px;background:var(--sf);color:var(--tx);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prio{display:flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.prio button{flex:1;border:0;border-right:1px solid var(--bd2);background:var(--sf);padding:10px 4px;font-size:14px;font-weight:600;color:var(--t2)}
.prio button:last-child{border-right:0}
.prio button.on[data-v=urgente]{background:var(--urg);color:#fff}
.prio button.on[data-v=normal]{background:var(--nor);color:#fff}
.prio button.on[data-v=baixa]{background:#64748b;color:#fff}
.qd{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.qd button{border:1px solid var(--bd2);background:var(--sf);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--t2);font-weight:500}

/* ---------- relatório ---------- */
.rfil{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:2px 14px 14px;margin-bottom:12px}
.rfil .g2{grid-template-columns:1fr 1fr}
.racts{display:flex;gap:8px;margin-top:12px}
.sheet{background:#fff;border:1px solid var(--bd);border-radius:4px;box-shadow:0 2px 8px rgba(15,23,42,.08);padding:18px 16px;font-size:13px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--tx);padding-bottom:10px}
.sh-h h2{margin:0;font-size:17px}
.sh-h .emp{font-size:12px;color:var(--t2);margin-top:2px}
.sh-h .meta{text-align:right;font-size:11px;color:var(--t2);line-height:1.5}
.sh-f{font-size:11px;color:var(--t2);margin:8px 0 10px}
.sh-sum{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd);border-radius:4px;margin-bottom:14px}
.sh-sum div{padding:6px 8px;border-right:1px solid var(--bd);text-align:center}
.sh-sum div:last-child{border-right:0}
.sh-sum b{display:block;font-size:16px}
.sh-sum span{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--t2)}
.sh-cli{font-weight:700;font-size:13px;background:#f1f5f9;padding:6px 8px;margin-top:10px;border-left:3px solid var(--tx);display:flex;justify-content:space-between}
table.rt{width:100%;border-collapse:collapse;margin-top:2px;table-layout:fixed}
table.rt th:nth-child(1){width:44px} table.rt th:nth-child(3){width:56px} table.rt th:nth-child(4){width:84px}
table.rt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--bd2)}
table.rt td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
table.rt td.n{white-space:nowrap;color:var(--t2)}
table.rt td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
table.rt td.d.late{color:var(--urg);font-weight:700}
table.rt .t{font-weight:600}
table.rt .s{color:var(--t2);font-size:12px;margin-top:2px}
table.rt .u{color:var(--urg);font-weight:700;font-size:10px;margin-left:4px}
.sh-foot{margin-top:16px;font-size:10px;color:var(--t3);text-align:center}

/* ---------- ajustes ---------- */
.set{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.set h3{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin:0;padding:12px 14px 4px}
.set .bd{padding:0 14px 14px}
.set p{font-size:13px;color:var(--t2);margin:6px 0 10px}
.set .btns{display:flex;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;border-top:1px solid var(--bd)}
.stat div{padding:10px 4px;border-right:1px solid var(--bd)}
.stat div:last-child{border-right:0}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* ---------- impressão ---------- */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .top,.nav,.fab,.rfil,.abar,.toast,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .sheet{border:0;box-shadow:none;padding:0;font-size:11.5px}
  .sh-cli{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
/* =====================================================================
   DADOS
   ===================================================================== */
const KEY = 'pendencias_v1';           // mesma chave da v1: os dados antigos continuam
const STATUS = {
  aberta:             'Aberta',
  andamento:          'Em andamento',
  aguardando_cliente: 'Aguard. cliente',
  aguardando_peca:    'Aguard. peça',
  concluida:          'Concluída'
};
const PRIO_TXT = { urgente:'Urgente', normal:'Normal', baixa:'Baixa' };
const TIPOS = ['Levar peça','Retornar contato','Orçamento','Verificar / testar','Visita','Treinamento','Outro'];

let db = carregar();

function carregar(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d || !Array.isArray(d.items)) d = { items: [] };
  return migrar(d);
}
function migrar(d){
  d.config = d.config || { nome:'', empresa:'' };
  if(d.versao === 2) return d;
  // v1 -> v2
  const ord = d.items.slice().sort((a,b) => (a.criadoEm||'').localeCompare(b.criadoEm||''));
  let seq = 0;
  for(const it of ord){
    it.numero = ++seq;
    if(it.status === 'feita'){ it.status = 'concluida'; it.concluidaEm = it.feitaEm || it.atualizadoEm || it.criadoEm; }
    else if(!STATUS[it.status]) it.status = 'aberta';
    delete it.feitaEm;
    it.historico = it.historico || [{ em: it.criadoEm, tipo:'sys', texto:'Pendência registrada' }];
    if(it.status === 'concluida') it.historico.push({ em: it.concluidaEm, tipo:'ok', texto:'Concluída' });
  }
  d.seq = seq; d.versao = 2;
  localStorage.setItem(KEY, JSON.stringify(d));
  return d;
}
function salvar(){ localStorage.setItem(KEY, JSON.stringify(db)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const agora = () => new Date().toISOString();
const numFmt = n => 'PND-' + String(n).padStart(4,'0');
const getIt = id => db.items.find(i => i.id === id);
const abertas = () => db.items.filter(i => i.status !== 'concluida');

/* =====================================================================
   DATAS
   ===================================================================== */
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const p2 = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const hoje = () => iso(new Date());
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dBR = s => { const d = parse(s); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}`; };
const dBRc = s => { const d = parse(s); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`; };
const dhBR = isoStr => { const d = new Date(isoStr); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const diffD = s => Math.round((parse(s) - parse(hoje()))/86400000);
function semana(){ const t = parse(hoje()), dow = (t.getDay()+6)%7, seg = addD(t,-dow); return { dom: iso(addD(seg,6)), pdom: iso(addD(seg,13)) }; }
function grupo(it){
  if(!it.data) return 'sem';
  const t = hoje();
  if(it.data < t) return 'atrasadas';
  if(it.data === t) return 'hoje';
  const w = semana();
  if(it.data <= w.dom) return 'semana';
  if(it.data <= w.pdom) return 'proxima';
  return 'depois';
}
const atrasada = it => it.status !== 'concluida' && it.data && it.data < hoje();
function rotData(s){
  if(!s) return '';
  const n = diffD(s);
  if(n === 0) return 'Hoje';
  if(n === 1) return 'Amanhã';
  if(n < 0) return `${-n}d atraso`;
  if(n < 7) return `${DIAS[parse(s).getDay()]} ${dBR(s)}`;
  return dBR(s);
}
function rotDataLonga(s){
  const n = diffD(s);
  const base = `${DIAS[parse(s).getDay()]}, ${dBRc(s)}`;
  if(n === 0) return base + ' — hoje';
  if(n === 1) return base + ' — amanhã';
  if(n < 0) return base + ` — ${-n} dia(s) em atraso`;
  return base + ` — em ${n} dias`;
}

const $ = s => document.querySelector(s);

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const PR = { urgente:0, normal:1, baixa:2 };
const porData = (a,b) => (a.data||'9999').localeCompare(b.data||'9999') || PR[a.prio]-PR[b.prio] || a.numero-b.numero;
const porCli  = (a,b) => (a.cliente||'~').localeCompare(b.cliente||'~','pt-BR') || porData(a,b);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
function nomesUnicos(campo){
  return [...new Map(db.items.filter(i => i[campo]).map(i => [norm(i[campo]), i[campo]])).values()].sort((a,b) => a.localeCompare(b,'pt-BR'));
}

let rel = { sit:'abertas', cli:'', prio:'' };
function ir(tela, id = null){ S = { tela, id }; history.pushState(S, ''); render(); window.scrollTo(0,0); }
function aba(tela){ S = { tela, id:null }; history.replaceState(S, ''); render(); window.scrollTo(0,0); }

function telaLista(){

function filtrarLista(){
  let base;
  if(ui.filtro === 'concluidas') base = db.items.filter(i => i.status === 'concluida');
  else {
    base = abertas();
    if(ui.filtro === 'hoje') base = base.filter(i => grupo(i) === 'hoje');
    if(ui.filtro === 'atrasadas') base = base.filter(atrasada);
    if(ui.filtro === 'urgentes') base = base.filter(i => i.prio === 'urgente');
  }
  const termos = norm(ui.q).split(/\s+/).filter(Boolean);
  if(termos.length) base = base.filter(it => {
    const alvo = norm([numFmt(it.numero), it.titulo, it.cliente, it.maquina, it.relato, it.tipo, STATUS[it.status], ...(it.historico||[]).map(h => h.texto)].join(' '));
    return termos.every(t => alvo.includes(t));
  });
  return base;
}

function linha(it){
  const done = it.status === 'concluida';
  let dt = '';
  if(done) dt = `<span class="dt">${it.concluidaEm ? dBR(iso(new Date(it.concluidaEm))) : ''}</span>`;
  else if(it.data){ const g = grupo(it); dt = `<span class="dt ${g==='atrasadas'?'late':g==='hoje'?'today':''}">${rotData(it.data)}</span>`; }
  const mostraCli = ui.agrupar !== 'cliente';
  const c1 = mostraCli ? (it.cliente || 'Sem cliente') : it.titulo;
  const c2 = mostraCli ? it.titulo : (it.maquina || it.tipo || '');
  return `<button class="row p-${it.prio} ${done?'done':''}" data-open="${it.id}">
    <span class="pr"></span>
    <span class="mid">
      <div class="c1">${esc(c1)}</div>
      ${c2 ? `<div class="c2">${esc(c2)}</div>` : ''}
      <div class="c3"><span class="mono">${numFmt(it.numero)}</span>${it.status!=='aberta' ? stTag(it.status) : ''}${it.prio==='urgente'&&!done ? prTag('urgente') : ''}</div>
    </span>
    <span class="rt">${dt}</span>
    <span class="chev">${ic('chev')}</span>
  </button>`;
}

function listaRes(){
  const itens = filtrarLista();
  const rotF = { abertas:'Abertas', hoje:'Para hoje', atrasadas:'Atrasadas', urgentes:'Urgentes', concluidas:'Concluídas' }[ui.filtro];
  const link = ui.filtro === 'concluidas'
    ? `<a href="#" data-f="abertas">Ver abertas</a>`
    : `<a href="#" data-f="concluidas">Ver concluídas</a>`;
  let h = `<div class="lbar"><span>${rotF} · ${itens.length}</span>${link}</div>`;
  if(!itens.length){
    h += `<div class="empty">${ic('inbox')}<div>${ui.q ? 'Nada encontrado para essa busca.' : ui.filtro==='abertas' ? 'Nenhuma pendência em aberto.<br>Toque em <b>Nova</b> para registrar.' : 'Nenhuma pendência neste filtro.'}</div></div>`;
    $('#lst').innerHTML = h; return;
  }
  h += '<div class="list">';
  if(ui.agrupar === 'cliente'){
    const m = new Map();
    for(const it of itens.sort(porCli)){
      const kk = it.cliente ? norm(it.cliente) : '~';
      if(!m.has(kk)) m.set(kk, { nome: it.cliente || 'Sem cliente', itens: [] });
      m.get(kk).itens.push(it);
    }
    for(const [kk,g] of m){
      h += `<div class="grp">${esc(g.nome)} <span class="n">${g.itens.length}</span><span class="sp"></span>
        ${kk !== '~' && ui.filtro !== 'concluidas' ? `<button data-wacli="${esc(kk)}" aria-label="Enviar">${ic('send')}</button>` : ''}</div>`;
      h += g.itens.map(linha).join('');
    }
  } else if(ui.filtro === 'concluidas'){
    h += itens.sort((a,b) => (b.concluidaEm||'').localeCompare(a.concluidaEm||'')).map(linha).join('');
  } else {
    const G = [['atrasadas','Atrasadas'],['hoje','Hoje'],['semana','Esta semana'],['proxima','Próxima semana'],['depois','Mais adiante'],['sem','Sem prazo']];
    for(const [g,r] of G){
      const l = itens.filter(i => grupo(i) === g).sort(porData);
      if(l.length) h += `<div class="grp ${g==='atrasadas'?'late':''}">${r} <span class="n">${l.length}</span></div>` + l.map(linha).join('');
    }
  }
  $('#lst').innerHTML = h + '</div>';
}

function avisoBackup(){
  if(!db.items.length) return '';
  const dias = db.lastBackup ? diffD(db.lastBackup) * -1 : null;
  if(dias !== null && dias < 14) return '';
  return `<div class="note">${ic('down')}<span>${dias === null ? 'Nenhum backup feito ainda.' : `Último backup há ${dias} dias.`}</span><button data-go="ajustes">Fazer backup</button></div>`;
}

function telaDetalhe(){
  const it = getIt(S.id);

  const done = it.status === 'concluida';
  const kv = [];
  if(it.maquina) kv.push(['Máquina', esc(it.maquina)]);
  if(it.tipo) kv.push(['Tipo', esc(it.tipo)]);
  kv.push(['Prazo', it.data ? `<span style="${atrasada(it)?'color:var(--urg);font-weight:600':''}">${rotDataLonga(it.data)}</span>` : '<span style="color:var(--t3)">Sem prazo</span>']);
  kv.push(['Registrada', dhBR(it.criadoEm)]);
  if(done && it.concluidaEm) kv.push(['Concluída', dhBR(it.concluidaEm)]);
  const hist = (it.historico || []).slice().reverse();
  const opts = Object.entries(STATUS).filter(([k]) => k !== 'concluida').map(([k,v]) => `<option value="${k}" ${it.status===k?'selected':''}>${v}</option>`).join('');

  document.getElementById('app').innerHTML = topo(numFmt(it.numero), esc(it.cliente || 'Sem cliente'),
    `<button class="ib" data-act="menu" aria-label="Mais opções">${ic('more')}</button>`, true) + `
  <main class="det">
    <div class="card">
      <div class="card-h">
        <div class="cli">${esc(it.cliente || 'Sem cliente')}</div>
        <h2>${esc(it.titulo)}</h2>
        <div class="chips">${stTag(it.status)}${prTag(it.prio)}</div>
      </div>
      <div class="kv">${kv.map(([a,b]) => `<div>${a}</div><div>${b}</div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="sec-t">Relato</div>
      <div class="relato ${it.relato?'':'vz'}">${it.relato ? esc(it.relato) : 'Sem relato.'}</div>
    </div>
    <div class="card">
      <div class="sec-t">Andamento</div>
      ${!done ? `<div class="addnote" style="padding-top:10px"><textarea id="nota" placeholder="Registrar andamento… (ex.: liguei, peça chega dia 20)"></textarea><button data-act="nota">Registrar</button></div>` : ''}
      <div class="tl">${hist.map(h => `<div class="tl-i ${h.tipo==='sys'||h.tipo==='status'?'sys':''} ${h.tipo==='ok'?'ok':''}"><span class="tl-d"></span><div class="tl-b"><small>${dhBR(h.em)}</small><div>${esc(h.texto)}</div></div></div>`).join('')}</div>
    </div>
  </main>
  <div class="abar"><div class="abar-in">
    ${done
      ? `<button class="btn f1" data-act="reabrir">${ic('refresh')}Reabrir</button><button class="btn f1" data-act="wa">${ic('send')}Enviar</button>`
      : `<div class="btn selbtn">${ic('flag')}Status<select id="selSt" aria-label="Alterar status">${opts}</select></div>
         <button class="btn f1" data-act="wa">${ic('send')}Enviar</button>
         <button class="btn ok f1" data-act="concluir">${ic('check')}Concluir</button>`}
  </div></div>`;
  const sel = $('#selSt');
  if(sel) sel.addEventListener('change', () => {
    if(sel.value === it.status) return;
    it.historico.push({ em: agora(), tipo:'status', texto:`Status: ${STATUS[it.status]} → ${STATUS[sel.value]}` });
    it.status = sel.value; it.atualizadoEm = agora(); salvar(); render(); toast('Status atualizado');
  });
}

function salvarForm(){
  const titulo = $('#fTit').value.trim();
  if(!titulo){ $('#fTit').focus(); toast('Informe a pendência'); return; }
  const dados = {
    cliente: $('#fCli').value.trim(), titulo, maquina: $('#fMaq').value.trim(),
    prio: $('#fPrio').dataset.v || 'normal', tipo: $('#fTipo').value, data: $('#fData').value || '',
    relato: $('#fRel').value.trim(), atualizadoEm: agora()
  };
  if(S.id){
    const it = getIt(S.id);
    const mud = [];
    if((it.data||'') !== dados.data) mud.push(`prazo ${it.data ? dBR(it.data) : '—'} → ${dados.data ? dBR(dados.data) : '—'}`);
    if(it.prio !== dados.prio) mud.push(`prioridade ${PRIO_TXT[it.prio]} → ${PRIO_TXT[dados.prio]}`);
    Object.assign(it, dados);
    it.historico.push({ em: agora(), tipo:'sys', texto: 'Editada' + (mud.length ? ': ' + mud.join('; ') : '') });
    salvar(); toast('Alterações salvas'); voltar();
  } else {
    db.seq = (db.seq || 0) + 1;
    const novo = { id: uid(), numero: db.seq, status:'aberta', criadoEm: agora(), concluidaEm:null,
      historico:[{ em: agora(), tipo:'sys', texto:'Pendência registrada' }], ...dados };
    db.items.push(novo); salvar(); toast(`${numFmt(novo.numero)} registrada`);
    S = { tela:'detalhe', id: novo.id }; history.replaceState(S, ''); render(); window.scrollTo(0,0);
  }
}

function dadosRelatorio(){
  const w = semana(), t = hoje();
  let l;
  switch(rel.sit){
    case 'atrasadas': l = abertas().filter(atrasada); break;
    case 'semana':    l = abertas().filter(i => i.data && i.data <= w.dom); break;
    case 'proxima':   l = abertas().filter(i => i.data && i.data > w.dom && i.data <= w.pdom); break;
    case 'concluidas30': { const lim = addD(new Date(), -30).toISOString(); l = db.items.filter(i => i.status==='concluida' && (i.concluidaEm||'') >= lim); break; }
    default:          l = abertas();
  }
  if(rel.cli) l = l.filter(i => norm(i.cliente) === rel.cli);
  if(rel.prio) l = l.filter(i => i.prio === rel.prio);
  return l.sort(porCli);
}
const SIT_TXT = { abertas:'Todas em aberto', atrasadas:'Atrasadas', semana:'Até o fim desta semana', proxima:'Próxima semana', concluidas30:'Concluídas (últimos 30 dias)' };
function ultimoAndamento(it){
  const h = (it.historico||[]).filter(x => x.tipo === 'nota');
  return h.length ? h[h.length-1] : null;
}
function telaRelatorio(){
  const cl = nomesUnicos('cliente');
  document.getElementById('app').innerHTML = topo('Relatório', 'Impressão e reunião') + `
  <main>
    <div class="rfil">
      <label for="rSit">Situação</label>
      <select id="rSit">${Object.entries(SIT_TXT).map(([k,v]) => `<option value="${k}" ${rel.sit===k?'selected':''}>${v}</option>`).join('')}</select>
      <div class="g2">
        <div><label for="rCli">Cliente</label><select id="rCli"><option value="">Todos</option>${cl.map(c => `<option value="${esc(norm(c))}" ${rel.cli===norm(c)?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label for="rPrio">Prioridade</label><select id="rPrio"><option value="">Todas</option>${Object.entries(PRIO_TXT).map(([k,v]) => `<option value="${k}" ${rel.prio===k?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="racts">
        <button class="btn pri f1" data-act="imprimir">${ic('print')}Imprimir / PDF</button>
        <button class="btn f1" data-act="waRel">${ic('send')}Enviar texto</button>
      </div>
    </div>
    <div id="sheet"></div>
  </main>
  ${navInferior()}`;
  const up = () => { rel = { sit: $('#rSit').value, cli: $('#rCli').value, prio: $('#rPrio').value }; folha(); };
  ['#rSit','#rCli','#rPrio'].forEach(s => $(s).addEventListener('change', up));
  folha();
}
function folha(){
  const l = dadosRelatorio();
  const conc = rel.sit === 'concluidas30';
  const d = new Date();
  const filtros = [SIT_TXT[rel.sit]];
  if(rel.cli){ const c = l[0]?.cliente || nomesUnicos('cliente').find(x => norm(x) === rel.cli); filtros.push('Cliente: ' + c); }
  if(rel.prio) filtros.push('Prioridade: ' + PRIO_TXT[rel.prio]);
  const grupos = new Map();
  for(const it of l){ const k = it.cliente ? norm(it.cliente) : '~'; if(!grupos.has(k)) grupos.set(k, { nome: it.cliente || 'Sem cliente', itens: [] }); grupos.get(k).itens.push(it); }
  let h = `<div class="sheet">
    <div class="sh-h">
      <div><h2>Relatório de Pendências</h2><div class="emp">${esc(db.config.empresa || '')}${db.config.empresa && db.config.nome ? ' · ' : ''}${esc(db.config.nome || '')}</div></div>
      <div class="meta">Emitido em<br><b>${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}</b></div>
    </div>
    <div class="sh-f">Filtro: ${esc(filtros.join(' · '))}</div>
    <div class="sh-sum">
      <div><b>${l.length}</b><span>Pendências</span></div>
      <div><b>${grupos.size}</b><span>Clientes</span></div>
      <div><b style="color:var(--urg)">${l.filter(atrasada).length}</b><span>Atrasadas</span></div>
      <div><b>${l.filter(i => i.prio==='urgente' && i.status!=='concluida').length}</b><span>Urgentes</span></div>
    </div>`;
  if(!l.length) h += `<p style="text-align:center;color:var(--t2);padding:20px 0">Nenhuma pendência para os filtros escolhidos.</p>`;
  for(const g of grupos.values()){
    h += `<div class="sh-cli"><span>${esc(g.nome)}</span><span>${g.itens.length}</span></div>
    <table class="rt"><thead><tr><th>Nº</th><th>Pendência</th><th>${conc?'Concluída':'Prazo'}</th><th>Status</th></tr></thead><tbody>`;
    for(const it of g.itens){
      const ua = ultimoAndamento(it);
      const sub = [it.maquina, it.tipo].filter(Boolean).join(' · ');
      const dt = conc ? (it.concluidaEm ? dBR(iso(new Date(it.concluidaEm))) : '') : (it.data ? dBR(it.data) : '—');
      h += `<tr>
        <td class="n mono">${String(it.numero).padStart(4,'0')}</td>
        <td><div class="t">${esc(it.titulo)}${it.prio==='urgente'?'<span class="u">URGENTE</span>':''}</div>
          ${sub ? `<div class="s">${esc(sub)}</div>` : ''}
          ${it.relato ? `<div class="s">${esc(it.relato.length > 160 ? it.relato.slice(0,160) + '…' : it.relato)}</div>` : ''}
          ${ua ? `<div class="s"><b>Últ. andamento (${dBR(iso(new Date(ua.em)))}):</b> ${esc(ua.texto)}</div>` : ''}</td>
        <td class="d ${atrasada(it)?'late':''}">${dt}</td>
        <td>${STATUS[it.status]}</td>
      </tr>`;
    }
    h += `</tbody></table>`;
  }
  h += `<div class="sh-foot">Gerado pelo app Pendências</div></div>`;
  $('#sheet').innerHTML = h;
}

/* =====================================================================
   TELA: AJUSTES
   ===================================================================== */
function telaAjustes(){
  const n = db.items.length, ab = abertas().length;
  document.getElementById('app').innerHTML = topo('Ajustes') + `
  <main>
    <div class="set">
      <h3>Identificação nos relatórios</h3>
      <div class="bd">
        <label for="cNome">Seu nome</label><input id="cNome" value="${esc(db.config.nome)}" placeholder="Ex.: Nilson">
        <label for="cEmp">Empresa</label><input id="cEmp" value="${esc(db.config.empresa)}" placeholder="Ex.: Galileu Tecnologia">
      </div>
    </div>
    <div class="set">
      <h3>Backup dos dados</h3>
      <div class="bd">
        <p>Os dados ficam somente neste aparelho. Exporte um backup regularmente e guarde no Drive, e-mail ou WhatsApp. Para trocar de celular, basta importar o arquivo.</p>
        <p><b>Último backup:</b> ${db.lastBackup ? dBRc(db.lastBackup) : 'nunca'}</p>
        <div class="btns"><button class="btn pri f1" data-act="exportar">${ic('down')}Exportar</button><button class="btn f1" data-act="importar">${ic('up')}Importar</button></div>
      </div>
      <div class="stat"><div><b>${n}</b><span>Total</span></div><div><b>${ab}</b><span>Abertas</span></div><div><b>${n-ab}</b><span>Concluídas</span></div></div>
    </div>
    <div class="set"><h3>Sobre</h3><div class="bd"><p>Pendências · versão 2.0<br>Controle pessoal de pendências por cliente.</p></div></div>
  </main>
  ${navInferior()}`;
  const sv = () => { db.config.nome = $('#cNome').value.trim(); db.config.empresa = $('#cEmp').value.trim(); salvar(); };
  $('#cNome').addEventListener('change', sv); $('#cEmp').addEventListener('change', sv);
}
function exportar(){
  const blob = new Blob([JSON.stringify({ app:'pendencias', versao:2, exportadoEm: agora(), seq: db.seq, config: db.config, items: db.items }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pendencias-backup-${hoje()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  db.lastBackup = hoje(); salvar(); render(); toast('Backup exportado');
}
$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    let d = JSON.parse(await f.text());
    if(!d || !Array.isArray(d.items)) throw 0;
    if(d.versao !== 2) d = migrar({ items: d.items });  // backup da v1
    const m = new Map(db.items.map(i => [i.id, i]));
    let nov = 0, atu = 0;
    for(const it of d.items){
      if(!it || !it.id || !it.titulo) continue;
      const ex = m.get(it.id);
      if(!ex){ m.set(it.id, it); nov++; } else if((it.atualizadoEm||'') > (ex.atualizadoEm||'')){ m.set(it.id, it); atu++; }
    }
    db.items = [...m.values()];
    db.seq = Math.max(db.seq || 0, d.seq || 0, ...db.items.map(i => i.numero || 0));
    if(d.config && !db.config.nome && !db.config.empresa) db.config = d.config;
    salvar(); render(); alert(`Backup importado.\n${nov} nova(s), ${atu} atualizada(s).`);
  }catch(err){ alert('Não foi possível ler esse arquivo. Verifique se é um backup deste app.'); }
});

/* =====================================================================
   TEXTO / WHATSAPP
   ===================================================================== */
function textoItem(it, comCli = true){
  let t = `*${numFmt(it.numero)}*${it.prio==='urgente' ? ' ⚠️ *URGENTE*' : ''}\n`;
  if(comCli && it.cliente) t += `*Cliente:* ${it.cliente}\n`;
  if(it.maquina) t += `*Máquina:* ${it.maquina}\n`;
  t += `*Pendência:* ${it.titulo}\n`;
  if(it.relato) t += `*Detalhes:* ${it.relato}\n`;
  if(it.data && it.status !== 'concluida') t += `*Prazo:* ${dBRc(it.data)}\n`;
  if(it.status !== 'aberta') t += `*Status:* ${STATUS[it.status]}\n`;
  const ua = ultimoAndamento(it); if(ua) t += `*Últ. andamento:* ${ua.texto}\n`;
  return t.trim();
}
function textoLista(l, titulo){
  const g = new Map();
  for(const it of l){ const k = it.cliente || 'Sem cliente'; if(!g.has(k)) g.set(k, []); g.get(k).push(it); }
  let t = `*${titulo}*\n`;
  for(const [c, its] of g){ t += `\n▪️ *${c}*\n` + its.map(it => textoItem(it, false)).join('\n\n') + '\n'; }
  return t.trim();
}
const enviar = t => window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
async function copiar(t){ try{ await navigator.clipboard.writeText(t); toast('Texto copiado'); }catch(e){ prompt('Copie o texto:', t); } }

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');   if(go){ aba(go.dataset.go); return; }
  const f  = e.target.closest('[data-f]');    if(f){ e.preventDefault(); ui.filtro = (ui.filtro === f.dataset.f && f.dataset.f !== 'abertas') ? 'abertas' : f.dataset.f; telaLista(); return; }
  const g  = e.target.closest('[data-g]');    if(g){ ui.agrupar = g.dataset.g; telaLista(); return; }
  const op = e.target.closest('[data-open]'); if(op){ ir('detalhe', op.dataset.open); return; }
  const wc = e.target.closest('[data-wacli]');
  if(wc){ const l = abertas().filter(i => norm(i.cliente) === wc.dataset.wacli).sort(porData); if(l.length) enviar(textoLista(l, `Pendências – ${l[0].cliente}`)); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const it = S.id ? getIt(S.id) : null;
  switch(a.dataset.act){
    case 'voltar': voltar(); break;
    case 'novo': ir('form'); break;
    case 'salvar': salvarForm(); break;
    case 'menu': abrirMenu(); break;
    case 'fecharMenu': fecharMenu(); break;
    case 'editar': fecharMenu(); ir('form', S.id); break;
    case 'copiar': fecharMenu(); copiar(textoItem(it)); break;
    case 'excluir':
      fecharMenu();
      if(confirm(`Excluir ${numFmt(it.numero)} definitivamente?\n\n"${it.titulo}"\n\nEssa ação não pode ser desfeita.`)){
        db.items = db.items.filter(i => i.id !== it.id); salvar(); toast('Pendência excluída'); voltar();
      }
      break;
    case 'nota': {
      const t = $('#nota').value.trim(); if(!t){ $('#nota').focus(); return; }
      it.historico.push({ em: agora(), tipo:'nota', texto: t }); it.atualizadoEm = agora();
      if(it.status === 'aberta'){ it.status = 'andamento'; }
      salvar(); render(); toast('Andamento registrado'); break;
    }
    case 'concluir':
      if(confirm(`Concluir ${numFmt(it.numero)}?\n\n"${it.titulo}"`)){
        it.status = 'concluida'; it.concluidaEm = agora(); it.atualizadoEm = agora();
        it.historico.push({ em: agora(), tipo:'ok', texto:'Concluída' }); salvar(); toast('Pendência concluída'); voltar();
      }
      break;
    case 'reabrir':
      it.status = 'aberta'; it.concluidaEm = null; it.atualizadoEm = agora();
      it.historico.push({ em: agora(), tipo:'status', texto:'Reaberta' }); salvar(); render(); toast('Pendência reaberta'); break;
    case 'wa': enviar(textoItem(it)); break;
    case 'imprimir': window.print(); break;
    case 'waRel': { const l = dadosRelatorio(); if(!l.length){ toast('Nada para enviar'); return; } enviar(textoLista(l, 'Pendências – ' + SIT_TXT[rel.sit])); break; }
    case 'exportar': exportar(); break;
    case 'importar': $('#fileImport').click(); break;
  }
});

/* atualiza "hoje/atrasada" ao voltar para o app (sem apagar formulário em edição) */
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.tela !== 'form') render(); });

history.replaceState(S, '');
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
